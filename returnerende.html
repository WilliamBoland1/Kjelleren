  <style>
    /* :root tokens, body base (.simple-page), .wrap base, .page-eyebrow base,
       .header-nav, .grain/.vignette, :focus-visible and the fadeUp/fadeIn
       keyframes are all shared in background.css — this page only keeps
       its own sizing overrides and content-specific rules. */
    .wrap {
      max-width: 560px;
      padding: clamp(3rem, 26vh, 11rem) clamp(1.25rem, 5vw, 2.5rem) clamp(0.5rem, 2vh, 1.5rem);
      text-align: center;
    }

    .page-eyebrow { margin-bottom: clamp(0.6rem, 1.8vh, 1rem); }

    .title {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: clamp(1.6rem, 4.6vh, 2.7rem);
      line-height: 1.12;
      margin-bottom: clamp(1rem, 3vh, 1.75rem);
    }
    .message {
      font-size: clamp(0.88rem, 2.2vh, 1.08rem);
      color: #c3d0e2;
      max-width: 460px;
      margin: 0 auto clamp(1.75rem, 5vh, 2.75rem);
    }
    .cta-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .wrap { padding-top: clamp(2.5rem, 14vh, 4rem); padding-bottom: 0.5rem; }
      .watermark { font-size: clamp(5rem, 34vh, 10rem); }
      .page-eyebrow { margin-bottom: 0.4rem; font-size: 0.64rem; }
      .title { font-size: clamp(1.3rem, 4.6vh, 1.9rem); margin-bottom: 0.7rem; }
      .message { margin-bottom: 1rem; }
    }

    /* ---- Entrance fade, matching the countdown page (keyframes shared
       in background.css) ---- */
    .header-logo, .header-nav, .page-eyebrow, .title, .message, .cta-row, .social-links {
      opacity: 0;
      animation: fadeUp 0.9s ease forwards;
    }
    .header-logo, .header-nav { animation-delay: 0.1s; }
    .social-links { animation-delay: 0.1s; }
    .page-eyebrow { animation-delay: 0.3s; }
    .title { animation-delay: 0.45s; }
    .message { animation-delay: 0.6s; }
    .cta-row { animation-delay: 0.75s; }

    @media (prefers-reduced-motion: reduce) {
      .header-logo, .header-nav, .page-eyebrow, .title, .message, .cta-row, .social-links {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>
