<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mannhullet · Jubileum 2027</title>
<meta name="description" content="Alle finner veien ned hit. En digital reise ned trappa til Mannhullet — jubileum 2027." />
<meta name="theme-color" content="#060b14" />

<!-- Elegant display serif + clean grotesk. Falls back to Georgia / system if offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>

<!-- ============ Global overlays ============ -->
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<!-- ============ Chrome ============ -->
<header class="topbar" id="topbar">
  <div class="brand">
    <span class="brand-word">Mannhullet</span>
    <span class="brand-est">Est 1917</span>
  </div>
  <div class="topbar-right">
    <!-- Jubileumslogo -->
    <span class="jub-logo" aria-label="Jubileumslogo">
      <img class="brand-mark" src="static/logo.png" alt="NTH 110 jubileumslogo" />
    </span>
    <button class="sound-toggle" id="soundToggle" aria-pressed="false" aria-label="Skru på lyd">
      <span class="sound-bars"><i></i><i></i><i></i><i></i></span>
      <span class="sound-label">Lyd</span>
    </button>
  </div>
</header>

<!-- ============ Descent progress — visible the whole way down ============ -->
<aside class="depth" id="depth" aria-hidden="true">
  <div class="depth-track">
    <div class="depth-fill" id="depthFill"></div>
    <div class="depth-marker" id="depthMarker"></div>
  </div>
  <span class="depth-dest">Kjelleren</span>
</aside>

<!-- ============ The building — one continuous gradient, normal document flow ============
     Scroll position IS the descent. Nothing is faked with transforms — the
     browser's native scroll carries you straight down through the fade. ============ -->
<main class="building" id="building">

  <!-- Floor 1 — the atrium, seen through the elevator glass -->
  <section class="floor floor--atrium" id="floorAtrium">
    <div class="hero-bg"></div>

    <a class="scroll-hint reveal" data-d="1" id="scrollHint" href="#floorCellar" aria-label="Gå ned til kjelleren">
      <span class="scroll-hint-line" aria-hidden="true"></span>
    </a>
  </section>

  <!-- The descent — no scenery, just the building's own wall gradually losing
       its daylight. A single smooth fade, not a place with things in it. -->
  <section class="floor floor--transition" id="floorTransition">
    <div class="waypoint" style="--wy:46%">
      <p class="waypoint-lead">MANNHULLET HAR JUBILEUM</p>
      <p class="waypoint-body">110-år med Trondheims beste linjeforening skal<br />feires.</p>
    </div>
  </section>

  <!-- The cellar — the elevator doors open on the party -->
  <section class="floor floor--cellar" id="floorCellar">
    <div class="cellar-img" id="cellarImg"></div>

    <div class="hotspots" id="hotspots">
      <button class="hot" style="--x:41%;--y:37%" data-key="historie">
        <span class="hot-dot"></span><span class="hot-name">Historien</span>
      </button>
      <button class="hot" style="--x:16%;--y:80%" data-key="billetter">
        <span class="hot-dot"></span><span class="hot-name">Baren · Billetter</span>
      </button>
      <button class="hot" style="--x:38%;--y:20%" data-key="spilleliste">
        <span class="hot-dot"></span><span class="hot-name">Anlegget · Spilleliste</span>
      </button>
      <button class="hot" style="--x:63%;--y:29%" data-key="program">
        <span class="hot-dot"></span><span class="hot-name">Tavla · Program</span>
      </button>
      <button class="hot" style="--x:13%;--y:41%" data-key="galleri">
        <span class="hot-dot"></span><span class="hot-name">Bildene · Galleri</span>
      </button>
      <button class="hot" style="--x:82%;--y:72%" data-key="effekter">
        <span class="hot-dot"></span><span class="hot-name">Jakka · Effekter</span>
      </button>
      <button class="hot" style="--x:93%;--y:47%" data-key="kontakt">
        <span class="hot-dot"></span><span class="hot-name">Døra · Kontakt</span>
      </button>
    </div>

    <div class="cellar-hint" id="cellarHint">Alt her nede er en dør. Trykk deg her inn.</div>
  </section>

</main>

<!-- ============ Modal ============ -->
<div class="modal-root" id="modalRoot" aria-hidden="true">
  <div class="modal-scrim" id="modalScrim"></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Lukk">×</button>
    <p class="modal-kicker" id="modalKicker"></p>
    <h2 class="modal-title" id="modalTitle"></h2>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="script.js?v=8"></script>
</body>
</html>
